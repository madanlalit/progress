[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "progress"
version = "1.0.0"
description = "Beautiful year calendar wallpapers showing your yearly progress"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Lalit Madan"},
    {name = "Antigravity"}
]
keywords = ["wallpaper", "calendar", "productivity", "macos", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/madanlalit/progress"
Repository = "https://github.com/madanlalit/progress"
Issues = "https://github.com/madanlalit/progress/issues"

[project.scripts]
progress = "progress.cli:main"
